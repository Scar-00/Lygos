[package]
name = "lygosc-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [ "llvm" , "lygos-macros"]


[dependencies]
lygos-macros = { path = "lygos-macros" }
llvm = { path = "llvm" }
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = {version = "4.0.11", features = ["derive"] }
ariadne.workspace = true
path-absolutize = "3.1.0"
libc.workspace = true
thiserror = "1.0.65"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[workspace.dependencies]
cc = { version = "1.0" }
libc = "0.2"
ariadne = "0.1.5"
